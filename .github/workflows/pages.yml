name: Publish Tarium site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tarium-pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and package site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate public catalog and governance
        run: python3 scripts/validate.py
      - name: Check tracked content for obvious disclosures
        run: python3 scripts/publication_guard.py
      - name: Build site
        run: python3 scripts/build_site.py
      - name: Test site and catalog
        run: |
          python3 -m unittest discover -s scripts -p 'test_site*.py'
          node --check site/app.js
          node --check site/theme.js
          node --test scripts/test_orbit.mjs scripts/test_theme.mjs
      - name: Verify actual browser appearance and automatic theme changes
        run: |
          npm install --no-save --package-lock=false playwright-core@1.56.1
          python3 -m http.server 8766 --directory _site >/tmp/tarium-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8766/ >/dev/null; then break; fi
            sleep 0.2
          done
          node scripts/browser_theme.mjs
      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    name: Deploy public registry
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
