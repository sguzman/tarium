name: Public integrity

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate registry and templates
        run: python3 scripts/validate.py
      - name: Check public-content signatures
        run: python3 scripts/publication_guard.py
